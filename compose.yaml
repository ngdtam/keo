services:
  keo:
    build: .
    image: keo:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${KEO_PORT:-8000}:8000"
    environment:
      KEO_TOKEN: ${KEO_TOKEN:?Set KEO_TOKEN in .env}
      KEO_YTM_AUTH: /secrets/${KEO_YTM_AUTH_FILE:-browser.json}
      KEO_YTM_CLIENT_ID: ${KEO_YTM_CLIENT_ID:-}
      KEO_YTM_CLIENT_SECRET: ${KEO_YTM_CLIENT_SECRET:-}
    volumes:
      - ${KEO_MUSIC_PATH:-./music}:/music
      - ${KEO_DATA_PATH:-./data}:/data
      - ${KEO_CONFIG_PATH:-./keo.toml}:/config/keo.toml:ro
      - ${KEO_SECRETS_PATH:-./secrets}:/secrets:ro
