{% macro song_list(songs) %}
<div class="card">
  <ul class="list-group list-group-flush">
  {% for song in songs %}
    <li class="list-group-item">
      <div class="row align-items-center">
        <div class="col">
          <div class="fw-bold">{{ song.title }}</div>
          <div class="text-secondary">{{ song.artists | join(", ") }}</div>
        </div>
        <div class="col-auto">
          <a class="btn" href="/songs/{{ song.video_id | urlencode }}/radio">Radio</a>
          <button type="button" class="btn" data-download='{{ {"video_id": song.video_id, "title": song.title, "artists": song.artists | list} | tojson }}'>Download</button>
        </div>
      </div>
    </li>
  {% else %}
    <li class="list-group-item">No songs.</li>
  {% endfor %}
  </ul>
</div>
{% endmacro %}
