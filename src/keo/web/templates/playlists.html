{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h2 class="page-title mb-3">{{ heading }}</h2>
<div class="card">
  <ul class="list-group list-group-flush">
  {% for playlist in playlists %}
    <li class="list-group-item"><a href="/playlists/{{ playlist.playlist_id | urlencode }}">{{ playlist.title }}</a></li>
  {% else %}
    <li class="list-group-item">Nothing here right now.</li>
  {% endfor %}
  </ul>
</div>
{% endblock %}
