{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h2 class="page-title mb-3">{{ heading }}</h2>
<div class="row row-cards">
  {% for playlist in playlists %}
  <div class="col-sm-6 col-md-4 col-lg-3">
    <a href="/playlists/{{ playlist.playlist_id | urlencode }}" class="card card-link h-100">
      <div class="card-body fw-medium">{{ playlist.title }}</div>
    </a>
  </div>
  {% else %}
  <div class="col-12 text-secondary">Nothing here right now.</div>
  {% endfor %}
</div>
{% endblock %}
